name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    container: ghcr.io/elementary/docker:circe-stable
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends devscripts equivs
          mk-build-deps -i -r -t 'apt-get -y --no-install-recommends' debian/control

      - name: Check the tag matches debian/changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(dpkg-parsechangelog -S Version)" = "$GITHUB_REF_NAME"

      - name: Build
        run: |
          dpkg-buildpackage -b -us -uc
          mkdir dist
          mv ../*.deb dist/

      - name: Install the package
        run: apt-get install -y ./dist/*.deb

      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: dist/*.deb

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.deb
          generate_release_notes: true

  tray:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends meson valac gcc libgtk-3-dev libjson-glib-dev libayatana-appindicator3-dev python3-gi gir1.2-glib-2.0 xvfb dbus-daemon
          - image: debian:trixie
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends meson valac gcc libgtk-3-dev libjson-glib-dev libayatana-appindicator3-dev python3-gi gir1.2-glib-2.0 xvfb dbus-daemon
          - image: fedora:latest
            install: dnf install -y meson vala gcc gtk3-devel json-glib-devel libayatana-appindicator-gtk3-devel python3-gobject xorg-x11-server-Xvfb dbus-daemon
          - image: archlinux:latest
            install: pacman -Syu --noconfirm --needed meson vala gcc pkgconf gtk3 json-glib libayatana-appindicator python-gobject xorg-server-xvfb
    name: tray (${{ matrix.image }})
    container: ${{ matrix.image }}
    steps:
      - name: Install build dependencies
        run: ${{ matrix.install }}

      - uses: actions/checkout@v7

      - name: Build
        run: |
          meson setup build -Dwingpanel=disabled -Dtray=enabled
          ninja -C build
          meson test -C build --print-errorlogs

      - name: Smoke test against a simulated tray host
        run: tests/tray-smoke.sh build/claude-agents-tray

  xfce:
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            meson valac gcc libgtk-3-dev libjson-glib-dev libayatana-appindicator3-dev \
            xvfb dbus-x11 dbus-daemon xfce4-panel xfwm4 x11-xserver-utils xdotool imagemagick librsvg2-common adwaita-icon-theme fonts-dejavu-core

      - uses: actions/checkout@v7

      - name: Build and install
        run: |
          meson setup build --prefix=/usr -Dwingpanel=disabled -Dtray=enabled
          ninja -C build install

      - name: Open the tray menu in a real XFCE panel
        run: tests/tray-xfce.sh screenshots

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xfce-screenshots
          path: screenshots

  rpm:
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - name: Install packaging tools
        run: dnf install -y git rpm-build rpmdevtools dnf-plugins-core

      - uses: actions/checkout@v7

      - name: Build and install the RPM
        run: |
          git config --global --add safe.directory "$PWD"
          spec=packaging/fedora/claude-agents-tray.spec
          version=$(rpmspec -q --srpm --qf '%{version}' $spec)
          rpmdev-setuptree
          git archive --prefix=claude-agents-indicator-$version/ -o ~/rpmbuild/SOURCES/claude-agents-indicator-$version.tar.gz HEAD
          dnf builddep -y $spec
          rpmbuild -bb $spec
          dnf install -y ~/rpmbuild/RPMS/*/claude-agents-tray-$version-*.rpm

  arch:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install packaging tools
        run: pacman -Syu --noconfirm --needed base-devel git

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build and install the package from this checkout
        run: |
          git config --system --add safe.directory '*'
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          install -d -o builder /tmp/pkg
          sed "s|git+\$url.git|git+file://$PWD|" packaging/arch/PKGBUILD > /tmp/pkg/PKGBUILD
          chown builder /tmp/pkg/PKGBUILD
          cd /tmp/pkg
          su builder -c 'makepkg -si --noconfirm'
