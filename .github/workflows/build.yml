name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    container: ghcr.io/elementary/docker:circe-stable
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends devscripts equivs
          mk-build-deps -i -r -t 'apt-get -y --no-install-recommends' debian/control

      - name: Check the tag matches debian/changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(dpkg-parsechangelog -S Version)" = "$GITHUB_REF_NAME"

      - name: Build
        run: |
          dpkg-buildpackage -b -us -uc
          mkdir dist
          mv ../claude-agents-indicator_*.deb dist/

      - name: Install the package
        run: apt-get install -y ./dist/*.deb

      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: dist/*.deb

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.deb
          generate_release_notes: true
